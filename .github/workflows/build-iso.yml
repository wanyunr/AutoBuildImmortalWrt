# 此工作流是为了构建一个 immortalwrt 固件的安装器，格式为 iso，可用于虚拟机和物理机
# ISO 引导一个启动速度极快的 Debian Live 系统，启动后输入命令 ddd 即可调出安装菜单
# 安装时若有多张硬盘，可选择目标硬盘；安装后的 OpenWrt 会保留剩余空间
# 更多信息请参考 wukongdaily/img-installer 项目

name: build ISO

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 luci 版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      profile:
        description: "请输入要编译固件大小，单位(MB)，多个值用英文逗号分隔"
        required: true
        default: "1024"
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      enable_pppoe:
        description: "是否配置 PPPoE 拨号信息?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "宽带账号 (若启用 PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用 PPPoE)"
        required: false
      release_suffix:
        description: "自定义 Release 后缀，例如 home、docker、pppoe"
        required: false
        default: "custom"

permissions:
  contents: write

jobs:
  build_immortalwrt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x "${{ github.workspace }}/x86-64/build24.sh"

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            echo "已追加 luci-app-store"
          else
            echo "未启用 luci-app-store"
          fi

      - name: Validate PPPoE inputs
        run: |
          if [ "${{ github.event.inputs.enable_pppoe }}" = "yes" ]; then
            if [ -z "${{ github.event.inputs.pppoe_account }}" ] || [ -z "${{ github.event.inputs.pppoe_password }}" ]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Build ImmortalWrt firmware
        run: |
          profiles="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          IFS=',' read -r -a profile_array <<< "$profiles"

          for profile in "${profile_array[@]}"; do
            profile="$(echo "$profile" | xargs)"
            echo "Building for profile: $profile"
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE="$profile" \
              -e INCLUDE_DOCKER="$include_docker" \
              -e ENABLE_PPPOE="${{ github.event.inputs.enable_pppoe }}" \
              -e PPPOE_ACCOUNT="${{ github.event.inputs.pppoe_account }}" \
              -e PPPOE_PASSWORD="${{ github.event.inputs.pppoe_password }}" \
              "immortalwrt/imagebuilder:x86-64-openwrt-${luci_version}" /bin/bash /home/build/immortalwrt/build.sh
          done

      - name: Collect firmware and manifest
        shell: bash
        run: |
          mkdir -p release-input
          cp "${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz release-input/
          cp "${{ github.workspace }}"/bin/targets/x86/64/*.manifest release-input/
          CUSTOM_PACKAGES=""
          source "${{ github.workspace }}/shell/custom-packages.sh"
          printf '%s\n' $CUSTOM_PACKAGES \
            | sed '/^$/d' \
            | awk '$0 !~ /^-/ && $0 ~ /^[A-Za-z0-9][A-Za-z0-9._+-]*$/' \
            | sort -u > release-input/custom-packages.list
          ls -lh release-input

      - name: Upload firmware artifact for ISO generation
        uses: actions/upload-artifact@v4
        with:
          name: firmware-img
          path: release-input/*
          if-no-files-found: error

  build_installer_iso:
    runs-on: ubuntu-22.04
    needs: build_immortalwrt

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-img

      - name: Prepare release variables
        id: vars
        shell: bash
        run: |
          timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
          suffix="${{ github.event.inputs.release_suffix }}"
          suffix="$(echo "${suffix:-custom}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
          [ -n "$suffix" ] || suffix="custom"

          tag="Custom-Installer-x86_64-ISO-${suffix}-${timestamp}"
          iso_name="immortalwrt-installer-x86_64-${suffix}-${timestamp}.iso"
          custom_packages_name="custom-packages-${timestamp}.list"

          {
            echo "timestamp=$timestamp"
            echo "suffix=$suffix"
            echo "tag=$tag"
            echo "iso_name=$iso_name"
            echo "custom_packages_name=$custom_packages_name"
          } >> "$GITHUB_OUTPUT"

      - name: Clone img-installer project
        run: git clone --depth 1 https://github.com/wukongdaily/img-installer.git

      - name: Set executable permissions for scripts
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: Build ISO
        run: |
          firmware_file="$(find . -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)"
          if [ -z "$firmware_file" ]; then
            echo "Error: firmware image not found."
            exit 1
          fi

          cd img-installer
          bash autobuild/autobuild.sh "../${firmware_file#./}"

      - name: Generate release files
        id: release_files
        shell: bash
        run: |
          mkdir -p release-assets

          if [ -f custom-packages.list ]; then
            cp custom-packages.list "release-assets/${{ steps.vars.outputs.custom_packages_name }}"
          else
            : > "release-assets/${{ steps.vars.outputs.custom_packages_name }}"
          fi
          cp img-installer/output/custom-installer-x86_64.iso "release-assets/${{ steps.vars.outputs.iso_name }}"

          firmware_file="$(find . -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)"
          firmware_name="$(basename "$firmware_file")"
          custom_package_count="$(wc -l < "release-assets/${{ steps.vars.outputs.custom_packages_name }}" | xargs)"
          iso_size="$(du -h "release-assets/${{ steps.vars.outputs.iso_name }}" | awk '{print $1}')"
          iso_sha256="$(sha256sum "release-assets/${{ steps.vars.outputs.iso_name }}" | awk '{print $1}')"
          iso_md5="$(md5sum "release-assets/${{ steps.vars.outputs.iso_name }}" | awk '{print $1}')"

          {
            echo "firmware_name=$firmware_name"
            echo "custom_package_count=$custom_package_count"
            echo "iso_size=$iso_size"
            echo "iso_sha256=$iso_sha256"
            echo "iso_md5=$iso_md5"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          cat > release-assets/release-info.md <<'EOF'
          # ImmortalWrt Installer ISO

          ## 构建信息

          | 项目 | 值 |
          | --- | --- |
          | Release Tag | `${{ steps.vars.outputs.tag }}` |
          | Release 后缀 | `${{ steps.vars.outputs.suffix }}` |
          | 构建时间 (Asia/Shanghai) | `${{ steps.vars.outputs.timestamp }}` |
          | Luci 版本 | `${{ github.event.inputs.luci_version }}` |
          | 固件大小 Profile | `${{ github.event.inputs.profile }} MB` |
          | Docker 插件 | `${{ github.event.inputs.include_docker }}` |
          | Store 商店 | `${{ github.event.inputs.enable_store }}` |
          | PPPoE 配置 | `${{ github.event.inputs.enable_pppoe }}` |
          | 固件文件 | `${{ steps.release_files.outputs.firmware_name }}` |
          | ISO 文件 | `${{ steps.vars.outputs.iso_name }}` |
          | ISO 大小 | `${{ steps.release_files.outputs.iso_size }}` |
          | ISO SHA256 | `${{ steps.release_files.outputs.iso_sha256 }}` |
          | ISO MD5 | `${{ steps.release_files.outputs.iso_md5 }}` |
          | Custom Packages | `${{ steps.release_files.outputs.custom_package_count }}` |

          ## 附件

          - `${{ steps.vars.outputs.iso_name }}`: bootable installer ISO
          - `${{ steps.vars.outputs.custom_packages_name }}`: selected packages from `shell/custom-packages.sh`
          EOF

      - name: Upload ISO and custom packages list to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ImmortalWrt Installer ISO ${{ steps.vars.outputs.suffix }} ${{ steps.vars.outputs.timestamp }}
          body_path: release-assets/release-info.md
          files: |
            release-assets/${{ steps.vars.outputs.iso_name }}
            release-assets/${{ steps.vars.outputs.custom_packages_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
