name: build 25.12.x ISO

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.0-rc2"
        type: choice
        options:
          - 25.12.0-rc1
          - 25.12.0-rc2

      profile:
        description: "请输入要编译固件大小 单位(MB)"
        required: true
        default: "1024"

      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false

      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

      release_suffix:
        description: "Release后缀(stable/test/beta)"
        required: false
        default: "stable"

permissions:
  contents: write

jobs:
  build_immortalwrt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/x86-64/build25.sh"

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ github.event.inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ github.event.inputs.pppoe_account }}" || -z "${{ github.event.inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: ✅ 正在构建 ImmortalWrt 固件
        run: |
          profile="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"

          echo "Building Profile: ${profile} MB"
          echo "Docker: ${include_docker}"
          echo "LuCI Version: ${luci_version}"

          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="${profile}" \
            -e INCLUDE_DOCKER="${include_docker}" \
            -e ENABLE_PPPOE="${{ github.event.inputs.enable_pppoe }}" \
            -e PPPOE_ACCOUNT="${{ github.event.inputs.pppoe_account }}" \
            -e PPPOE_PASSWORD="${{ github.event.inputs.pppoe_password }}" \
            immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: ✅ 复制固件到工作目录
        run: |
          cp bin/targets/x86/64/*squashfs-combined-efi.img.gz .
          cp bin/targets/x86/64/*.manifest .

      - name: ✅ 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: firmware-files
          path: |
            *.img.gz
            *.manifest

  build_installer_iso:
    runs-on: ubuntu-22.04
    needs: build_immortalwrt

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-files

      - name: ⏬ 克隆 img-installer
        run: |
          git clone https://github.com/wukongdaily/img-installer.git

      - name: Set executable permissions
        run: |
          chmod +x img-installer/custom.sh
          chmod +x img-installer/supportFiles/custom/build.sh

      - name: Generate Release Information
        id: release_info
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")

          LUCI="${{ github.event.inputs.luci_version }}"
          PROFILE="${{ github.event.inputs.profile }}"
          DOCKER="${{ github.event.inputs.include_docker }}"
          SUFFIX="${{ github.event.inputs.release_suffix }}"

          TAG="ISO-${LUCI}-${PROFILE}M-${DOCKER}-${TIMESTAMP}-${SUFFIX}"

          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract Package List
        id: pkglist
        run: |
          MANIFEST=$(find . -name "*.manifest" | head -n1)

          if [ -f "$MANIFEST" ]; then

            awk '{print $1}' "$MANIFEST" \
              | sort -u > packages.list

            COUNT=$(wc -l < packages.list)

            {
              echo "packages<<EOF"
              head -100 packages.list
              echo ""
              echo "... (仅显示前100个软件包)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          else

            echo "manifest not found" > packages.list

            {
              echo "packages<<EOF"
              echo "manifest not found"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            echo "count=0" >> "$GITHUB_OUTPUT"

          fi

      - name: ✅ 制作 ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)

          cd img-installer

          bash autobuild/autobuild.sh "../${firmware_file}"

      - name: Rename ISO
        run: |
          LUCI="${{ github.event.inputs.luci_version }}"
          PROFILE="${{ github.event.inputs.profile }}"
          DOCKER="${{ github.event.inputs.include_docker }}"
          TIME="${{ steps.release_info.outputs.timestamp }}"
          SUFFIX="${{ github.event.inputs.release_suffix }}"

          NEW_NAME="immortalwrt-installer-${LUCI}-${PROFILE}M-${DOCKER}-${TIME}-${SUFFIX}.iso"

          mv \
            img-installer/output/custom-installer-x86_64.iso \
            img-installer/output/${NEW_NAME}

          echo "ISO Name: ${NEW_NAME}"

      - name: Generate Release Notes
        run: |
          cat > release.md << EOF
          # ImmortalWrt Installer ISO

          基于 Debian Live 的 ImmortalWrt/OpenWrt 安装器。

          启动后执行：

          \`\`\`bash
          ddd
          \`\`\`

          即可进入安装菜单。

          ---

          ## 构建信息

          | 项目 | 内容 |
          |------|------|
          | LuCI版本 | ${{ github.event.inputs.luci_version }} |
          | 固件大小 | ${{ github.event.inputs.profile }} MB |
          | Docker支持 | ${{ github.event.inputs.include_docker }} |
          | PPPoE预配置 | ${{ github.event.inputs.enable_pppoe }} |
          | Release后缀 | ${{ github.event.inputs.release_suffix }} |
          | 构建时间 | ${{ steps.release_info.outputs.timestamp }} |
          | Git Commit | ${{ github.sha }} |
          | Git Branch | ${{ github.ref_name }} |
          | Workflow | ${{ github.workflow }} |

          ---

          ## 安装器特性

          - Debian Live 极速启动
          - 支持 BIOS / UEFI
          - 支持 VMware
          - 支持 Proxmox VE
          - 支持 ESXi
          - 支持 Hyper-V
          - 支持 KVM/QEMU
          - 支持 VirtualBox
          - 支持实体机安装
          - 支持多硬盘选择
          - 自动扩容剩余空间
          - 安装后保留剩余磁盘空间
          - 基于 wukongdaily/img-installer

          ---

          ## 内置软件包

          总计：

          **${{ steps.pkglist.outputs.count }} 个软件包**

          前100项：

          \`\`\`text
          ${{ steps.pkglist.outputs.packages }}
          \`\`\`

          完整列表请下载附件：

          \`packages.list\`

          ---

          ## ISO 文件

          \`\`\`
          immortalwrt-installer-${{ github.event.inputs.luci_version }}-${{ github.event.inputs.profile }}M-${{ github.event.inputs.include_docker }}-${{ steps.release_info.outputs.timestamp }}-${{ github.event.inputs.release_suffix }}.iso
          \`\`\`

          EOF

      - name: 🚀 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}

          name: |
            ImmortalWrt Installer ${{ steps.release_info.outputs.timestamp }}

          body_path: release.md

          files: |
            img-installer/output/*.iso
            packages.list

          generate_release_notes: true

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 上传 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-iso
          path: |
            img-installer/output/*.iso

      - name: 📦 上传 Package List Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-list
          path: packages.list
